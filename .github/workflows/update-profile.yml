name: Update Profile README and Portfolio

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'reports/figures/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          repository: arthurpmotta02/arthurpmotta02
          token: ${{ secrets.PROFILE_TOKEN }}
          path: profile-repo

      - name: Checkout portfolio repo
        uses: actions/checkout@v4
        with:
          repository: arthurpmotta02/arthurpmotta02.github.io
          token: ${{ secrets.PROFILE_TOKEN }}
          path: portfolio-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python .github/scripts/update_readmes.py

      - name: Commit profile README
        run: |
          cd profile-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update from insurance-pricing-susep"
          git push

      - name: Commit portfolio
        run: |
          cd portfolio-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md
          git diff --staged --quiet || git commit -m "chore: auto-update from insurance-pricing-susep"
          git push